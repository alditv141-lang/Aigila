<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="color-scheme" content="dark">
<title>Liquid Chat AI</title>
<style>
  :root {
    --glass: rgba(255,255,255,.12);
    --stroke: rgba(255,255,255,.28);
    --text: #f5f7ff;
    --muted: rgba(245,247,255,.65);
    --accent: #5aa2ff;
    --lite-bg: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.07)), rgba(20,26,66,.55);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: #0b1026;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* ===== Latar belakang cair (hanya transform = jalan di GPU, tanpa blur filter) ===== */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; contain: strict;
        background: linear-gradient(160deg, #0b1026, #1a1040 50%, #0b2a3d); }
  .blob { position: absolute; border-radius: 50%; will-change: transform;
          transform: translate3d(0,0,0); animation: float 24s ease-in-out infinite alternate; }
  .b1 { width: 420px; height: 420px; top: -120px; left: -140px;
        background: radial-gradient(circle, rgba(59,130,246,.85), rgba(59,130,246,0) 68%); }
  .b2 { width: 460px; height: 460px; bottom: -160px; right: -180px; animation-delay: -8s;
        background: radial-gradient(circle, rgba(168,85,247,.85), rgba(168,85,247,0) 68%); }
  .b3 { width: 340px; height: 340px; top: 38%; left: 50%; animation-delay: -14s;
        background: radial-gradient(circle, rgba(6,182,212,.8), rgba(6,182,212,0) 68%); }
  .b4 { width: 300px; height: 300px; top: 52%; left: -100px; animation-delay: -4s;
        background: radial-gradient(circle, rgba(244,114,182,.8), rgba(244,114,182,0) 68%); }
  @keyframes float { to { transform: translate3d(50px, -70px, 0) scale(1.12); } }

  /* ===== Kaca asli (blur) - hanya untuk header & kolom ketik ===== */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid var(--stroke);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.08), 0 6px 20px rgba(0,0,0,.25);
  }
  /* ===== Kaca ringan (tanpa blur) - untuk gelembung chat, chip, toast ===== */
  .glass-lite {
    background: var(--lite-bg);
    border: 1px solid var(--stroke);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 3px 10px rgba(0,0,0,.18);
  }
  /* Mode hemat otomatis kalau perangkat terdeteksi berat */
  body.lite .blob { animation: none; }
  body.lite .glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--lite-bg); }
  @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }

  .app { height: 100dvh; max-width: 780px; margin: 0 auto; display: flex; flex-direction: column;
         padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px); gap: 10px; }

  /* ===== Header ===== */
  header { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 16px; border-radius: 999px; }
  .logo { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg,#7dd3fc,#c084fc);
          box-shadow: 0 0 10px #7dd3fc; flex: none; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .2px; flex: none; }
  .spacer { flex: 1; min-width: 4px; }
  select {
    max-width: 150px; appearance: none; -webkit-appearance: none; color: var(--text); font-size: 12px;
    background: var(--glass); border: 1px solid var(--stroke); border-radius: 999px; padding: 8px 12px;
    text-overflow: ellipsis; outline: none;
  }
  select option { color: #111; }

  .icon-btn {
    position: relative; width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center;
    color: var(--text); cursor: pointer; padding: 0; font: inherit; touch-action: manipulation;
    background: var(--glass); border: 1px solid var(--stroke);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
    transition: transform .12s ease-out;
  }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn.on { background: rgba(90,162,255,.45); border-color: rgba(160,205,255,.8); }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.sm { width: 32px; height: 32px; }
  .icon-btn.sm svg { width: 16px; height: 16px; }
  .icon-btn.rec { background: rgba(255,80,100,.6); border-color: rgba(255,150,160,.9); }
  .icon-btn.rec::after { content: ""; position: absolute; inset: -2px; border-radius: 50%;
                         border: 2px solid rgba(255,110,130,.85); animation: ping 1.2s ease-out infinite; }
  @keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }

  /* ===== Area chat ===== */
  #chat { flex: 1; overflow-y: auto; padding: 4px 2px 8px; display: flex; flex-direction: column; gap: 12px;
          overscroll-behavior: contain; -webkit-overflow-scrolling: touch; overflow-anchor: none; }
  #chat::-webkit-scrollbar { width: 0; }

  .empty { margin: auto; text-align: center; padding: 20px; }
  .empty .big { font-size: 28px; font-weight: 700; margin-bottom: 6px;
                background: linear-gradient(90deg,#9ad1ff,#d3a8ff,#ffb3d9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .empty p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip-s { padding: 9px 14px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--text); font-family: inherit; }

  .row { display: flex; contain: layout style; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 88%; padding: 10px 14px; border-radius: 22px; font-size: 15px; line-height: 1.5; word-wrap: break-word; overflow-wrap: anywhere; }
  .row.user .bubble {
    background: linear-gradient(135deg, rgba(59,130,246,.75), rgba(124,92,246,.62));
    border: 1px solid rgba(190,215,255,.5); border-bottom-right-radius: 8px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 3px 10px rgba(40,70,200,.28);
    white-space: pre-wrap;
  }
  .row.ai .bubble { border-bottom-left-radius: 8px; max-width: 94%; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble h3, .bubble h4, .bubble h5 { margin: 10px 0 6px; }
  .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 22px; }
  .bubble code { background: rgba(0,0,0,.35); padding: 2px 6px; border-radius: 6px; font-size: 13px;
                 font-family: ui-monospace, Menlo, Consolas, monospace; }

  .code { margin: 8px 0; border-radius: 16px; overflow: hidden; background: rgba(5,8,25,.6);
          border: 1px solid rgba(255,255,255,.18); }
  .code-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px 6px 14px;
               background: rgba(255,255,255,.08); font-size: 12px; color: var(--muted); }
  .code-head button { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); color: var(--text);
                      border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .code pre { margin: 0; padding: 12px 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .code pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; white-space: pre; color: #d6e4ff; }

  .actions { display: flex; gap: 6px; margin-top: 8px; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--text); opacity: .5; animation: bounce 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-5px); opacity: 1; } }
  .err { color: #ffb4bd; }

  .att { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .att img { width: 90px; height: 90px; object-fit: cover; border-radius: 14px; border: 1px solid rgba(255,255,255,.4); }
  .att .file { padding: 6px 10px; border-radius: 12px; font-size: 12px; background: rgba(255,255,255,.18); }

  /* ===== Composer ===== */
  .composer { border-radius: 28px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 4px; }
  #chips:empty { display: none; }
  .achip { position: relative; flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px;
           border-radius: 14px; background: rgba(255,255,255,.16); border: 1px solid var(--stroke); font-size: 12px; max-width: 170px; }
  .achip img { width: 34px; height: 34px; object-fit: cover; border-radius: 10px; }
  .achip .fi { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.18); font-size: 16px; }
  .achip span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .achip button { border: 0; background: rgba(0,0,0,.35); color: #fff; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; line-height: 1; padding: 0; }
  .bar { display: flex; align-items: flex-end; gap: 6px; }
  textarea {
    flex: 1; resize: none; border: 0; outline: none; background: transparent; color: var(--text);
    font: inherit; font-size: 16px; line-height: 1.4; padding: 10px 6px; max-height: 140px; min-height: 40px;
  }
  textarea::placeholder { color: var(--muted); }
  .send { background: linear-gradient(135deg, #5aa2ff, #8b5cf6); border-color: rgba(255,255,255,.5); }

  .toast { position: fixed; top: calc(env(safe-area-inset-top) + 74px); left: 50%; transform: translate3d(-50%, -20px, 0);
           padding: 10px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none;
           transition: transform .25s ease-out, opacity .25s ease-out; z-index: 10; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translate3d(-50%, 0, 0); }
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>

<div class="app">
  <header class="glass">
    <div class="logo"></div>
    <h1>Liquid Chat</h1>
    <div class="spacer"></div>
    <select id="modelSel" title="Model"><option>Memuat model…</option></select>
    <button class="icon-btn" id="autoSpeakBtn" title="Baca jawaban otomatis" aria-label="Baca otomatis"></button>
    <button class="icon-btn" id="newBtn" title="Chat baru" aria-label="Chat baru"></button>
  </header>

  <div id="chat"></div>

  <div class="composer glass">
    <div id="chips"></div>
    <div class="bar">
      <button class="icon-btn" id="attachBtn" title="Lampirkan gambar / file" aria-label="Lampirkan"></button>
      <textarea id="input" rows="1" placeholder="Tulis pesan atau tempel gambar…"></textarea>
      <button class="icon-btn" id="micBtn" title="Bicara" aria-label="Mikrofon"></button>
      <button class="icon-btn send" id="sendBtn" title="Kirim" aria-label="Kirim"></button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" multiple hidden
  accept="image/*,.txt,.md,.json,.csv,.js,.ts,.jsx,.tsx,.py,.html,.css,.java,.c,.cpp,.cs,.php,.xml,.yml,.yaml,.log,.sql,.sh,.kt,.go,.rb,.rs">
<div class="toast glass-lite" id="toast"></div>

<script>
  // ============ KONFIGURASI (GEMINI) ============
  const API_KEY = "AQ.Ab8RN6KAWoRuL6pVoLIh8dlpAUCysR1a_I9ouK3n6QH4AAo7OQ";
  const BASE = "https://generativelanguage.googleapis.com/v1beta";
  const DEFAULT_MODEL = "gemini-2.5-flash";
  const SYSTEM_PROMPT = "Kamu asisten AI yang ramah dan membantu. Jawab dalam bahasa yang dipakai pengguna. " +
                        "Untuk kode, selalu gunakan blok kode markdown dengan nama bahasa (```js, ```python, dst).";

  // ============ IKON ============
  const IC = {
    plus:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    clip:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l9-9a3.7 3.7 0 015.2 5.2l-9 9a1.8 1.8 0 01-2.6-2.6l8.3-8.3"/></svg>',
    mic:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
    send:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    stop:  '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="3"/></svg>',
    spk:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>',
    copy:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>'
  };

  // ============ ELEMEN ============
  const $ = (id) => document.getElementById(id);
  const chat = $("chat"), input = $("input"), sendBtn = $("sendBtn"), micBtn = $("micBtn");
  const attachBtn = $("attachBtn"), fileInput = $("fileInput"), chipsEl = $("chips");
  const modelSel = $("modelSel"), newBtn = $("newBtn"), autoSpeakBtn = $("autoSpeakBtn"), toastEl = $("toast");

  newBtn.innerHTML = IC.plus;
  attachBtn.innerHTML = IC.clip;
  micBtn.innerHTML = IC.mic;
  sendBtn.innerHTML = IC.send;
  autoSpeakBtn.innerHTML = IC.spk;

  // ============ STATE ============
  let MODEL = null;
  let ALL_MODELS = [];
  let busy = false;
  let ctrl = null;
  let autoSpeak = false;
  const lampiran = [];
  // Riwayat dalam format Gemini: { role: "user" | "model", parts: [...] }
  let riwayat = [];

  // ============ UTIL ============
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  // Auto-scroll hanya kalau pengguna memang ada di bawah
  let stick = true;
  chat.addEventListener("scroll", () => {
    stick = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 90;
  }, { passive: true });
  function scrollBawah(paksa) {
    if (paksa) stick = true;
    if (stick) chat.scrollTop = chat.scrollHeight;
  }

  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (_) {}
      ta.remove();
    }
    toast("Tersalin");
  }

  // ============ MODE HEMAT OTOMATIS ============
  (function cekKelancaran() {
    let last = 0, n = 0, lambat = 0;
    function tick(now) {
      if (last) {
        const dt = now - last;
        n++;
        if (n > 15 && dt > 26) lambat++;
      }
      last = now;
      if (n < 150) requestAnimationFrame(tick);
      else if (lambat > 25) document.body.classList.add("lite");
    }
    requestAnimationFrame(tick);
  })();

  // ============ MARKDOWN RINGAN ============
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    return s;
  }
  function renderText(t) {
    const lines = t.split("\n");
    let out = "", list = null;
    const close = () => { if (list) { out += "</" + list + ">"; list = null; } };
    for (const raw of lines) {
      const l = raw.trimEnd();
      let m;
      if ((m = l.match(/^(#{1,3})\s+(.*)/))) { close(); const n = m[1].length + 2; out += "<h" + n + ">" + inline(m[2]) + "</h" + n + ">"; }
      else if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += "<li>" + inline(m[1]) + "</li>"; }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += "<li>" + inline(m[1]) + "</li>"; }
      else if (l.trim() === "") { close(); }
      else { close(); out += "<p>" + inline(l) + "</p>"; }
    }
    close();
    return out;
  }
  function renderMd(text) {
    const parts = text.split("```");
    let html = "";
    parts.forEach((p, i) => {
      if (i % 2 === 1) {
        const nl = p.indexOf("\n");
        let lang = "", code = p;
        if (nl > -1 && /^[\w+#.\-]*$/.test(p.slice(0, nl).trim())) {
          lang = p.slice(0, nl).trim();
          code = p.slice(nl + 1);
        }
        html += '<div class="code"><div class="code-head"><span>' + esc(lang || "kode") +
                '</span><button class="copy-code">Salin</button></div><pre><code>' + esc(code) + "</code></pre></div>";
      } else {
        html += renderText(p);
      }
    });
    return html;
  }

  // ============ SUARA KELUAR (TTS) ============
  function speak(text) {
    if (!("speechSynthesis" in window)) { toast("Browser tidak mendukung suara"); return; }
    speechSynthesis.cancel();
    const clean = text.replace(/```[\s\S]*?```/g, " (ada blok kode) ").replace(/[*#`_]/g, "");
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "id-ID";
    speechSynthesis.speak(u);
  }
  autoSpeakBtn.addEventListener("click", () => {
    autoSpeak = !autoSpeak;
    autoSpeakBtn.classList.toggle("on", autoSpeak);
    if (!autoSpeak && "speechSynthesis" in window) speechSynthesis.cancel();
    toast(autoSpeak ? "Baca otomatis: hidup" : "Baca otomatis: mati");
  });

  // ============ SUARA MASUK (MIKROFON) ============
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  function setListening(v) { listening = v; micBtn.classList.toggle("rec", v); }
  micBtn.addEventListener("click", () => {
    if (!SR) { toast("Browser ini tidak mendukung input suara"); return; }
    if (listening) { rec && rec.stop(); return; }
    rec = new SR();
    rec.lang = "id-ID";
    rec.interimResults = true;
    rec.continuous = false;
    const dasar = input.value ? input.value.trim() + " " : "";
    rec.onresult = (e) => {
      let t = "";
      for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      input.value = dasar + t;
      autosize();
    };
    rec.onerror = (e) => {
      const pesan = e.error === "not-allowed" || e.error === "service-not-allowed"
        ? "Mikrofon diblokir. Izinkan akses mikrofon, atau buka lewat https."
        : "Mic error: " + e.error;
      toast(pesan);
    };
    rec.onend = () => setListening(false);
    try { rec.start(); setListening(true); } catch (err) { toast("Gagal memulai mic"); }
  });

  // ============ LAMPIRAN ============
  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 1280;
        let w = img.width, h = img.height;
        const s = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * s); h = Math.round(h * s);
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Gagal membaca gambar")); };
      img.src = url;
    });
  }
  async function tambahFile(file) {
    if (file.type.startsWith("image/")) {
      if (lampiran.filter(a => a.type === "image").length >= 4) { toast("Maksimal 4 gambar"); return; }
      try { lampiran.push({ type: "image", name: file.name || "gambar", dataUrl: await resizeImage(file) }); }
      catch (e) { toast(e.message); }
    } else if (/\.pdf$/i.test(file.name)) {
      toast("PDF belum didukung. Salin teksnya atau pakai file teks.");
    } else {
      if (file.size > 500 * 1024) { toast("File terlalu besar (maks 500 KB)"); return; }
      try {
        let text = await file.text();
        if (text.length > 30000) text = text.slice(0, 30000) + "\n…(dipotong)";
        lampiran.push({ type: "text", name: file.name, text });
      } catch (e) { toast("Gagal membaca file"); }
    }
    renderChips();
  }
  function renderChips() {
    chipsEl.innerHTML = "";
    lampiran.forEach((a, i) => {
      const d = document.createElement("div");
      d.className = "achip";
      d.innerHTML = (a.type === "image" ? '<img decoding="async" src="' + a.dataUrl + '">' : '<div class="fi">📄</div>') +
                    '<span class="n">' + esc(a.name) + '</span><button aria-label="Hapus">×</button>';
      d.querySelector("button").onclick = () => { lampiran.splice(i, 1); renderChips(); };
      chipsEl.appendChild(d);
    });
  }
  attachBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", async () => {
    for (const f of fileInput.files) await tambahFile(f);
    fileInput.value = "";
  });
  input.addEventListener("paste", async (e) => {
    const items = (e.clipboardData && e.clipboardData.files) || [];
    for (const f of items) if (f.type.startsWith("image/")) { e.preventDefault(); await tambahFile(f); }
  });

  // ============ MODEL (GEMINI) ============
  async function muatModel() {
    const res = await fetch(BASE + "/models?pageSize=200", { headers: { "x-goog-api-key": API_KEY } });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const ids = (data.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
      .map(m => m.name.replace(/^models\//, ""))
      .filter(id => /gemini/i.test(id) && !/embed|tts|image|live|audio|robotics|computer-use|aqa|native|imagen|veo|learnlm/i.test(id));
    if (!ids.length) throw new Error("Tidak ada model Gemini yang tersedia untuk key ini.");
    const favorit = ["gemini-2.5-flash", "gemini-flash-latest", "gemini-2.0-flash", "gemini-2.5-flash-lite"];
    ALL_MODELS = favorit.filter(f => ids.includes(f)).concat(ids.filter(id => !favorit.includes(id)));
    MODEL = ALL_MODELS[0];
    modelSel.innerHTML = ALL_MODELS.map(id => '<option value="' + id + '">' + id + "</option>").join("");
    modelSel.value = MODEL;
  }
  modelSel.addEventListener("change", () => { MODEL = modelSel.value; });

  // Kalau daftar model gagal dimuat, tetap coba pakai model bawaan
  async function pastikanModel() {
    if (!ALL_MODELS.length) {
      try { await muatModel(); } catch (e) { MODEL = MODEL || DEFAULT_MODEL; }
    }
    return MODEL || DEFAULT_MODEL;
  }

  // ============ TAMPILAN PESAN ============
  function kosongkan() {
    chat.innerHTML = '<div class="empty" id="empty"><div class="big">Halo 👋</div>' +
      '<p>Mau ngobrol apa hari ini? Bisa kirim teks, suara, kode, gambar, atau file.</p>' +
      '<div class="chips"></div></div>';
    const saran = ["Buatkan kode HTML tombol kaca", "Jelaskan cara kerja AI", "Ide bisnis kecil dari HP", "Terjemahkan ke Inggris: selamat pagi"];
    const wrap = chat.querySelector(".chips");
    saran.forEach(s => {
      const b = document.createElement("button");
      b.className = "chip-s glass-lite"; b.textContent = s;
      b.onclick = () => kirim(s);
      wrap.appendChild(b);
    });
  }
  function sembunyikanKosong() { const e = $("empty"); if (e) e.remove(); }

  function tambahUser(teks, att) {
    const row = document.createElement("div");
    row.className = "row user";
    const b = document.createElement("div");
    b.className = "bubble";
    if (att.length) {
      const w = document.createElement("div");
      w.className = "att";
      att.forEach(a => {
        if (a.type === "image") { const im = document.createElement("img"); im.decoding = "async"; im.src = a.dataUrl; w.appendChild(im); }
        else { const f = document.createElement("div"); f.className = "file"; f.textContent = "📄 " + a.name; w.appendChild(f); }
      });
      b.appendChild(w);
    }
    if (teks) b.appendChild(document.createTextNode(teks));
    row.appendChild(b);
    chat.appendChild(row);
    scrollBawah(true);
  }

  function tambahAi() {
    const row = document.createElement("div");
    row.className = "row ai";
    const b = document.createElement("div");
    b.className = "bubble glass-lite";
    const isi = document.createElement("div");
    isi.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
    b.appendChild(isi);
    row.appendChild(b);
    chat.appendChild(row);
    scrollBawah();

    // Render dibatasi maksimal sekali per frame supaya mulus saat teks mengalir
    let tunggu = null, raf = 0;
    const gambar = () => { raf = 0; isi.innerHTML = renderMd(tunggu); scrollBawah(); };
    const batal = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } };

    return {
      set(t) { tunggu = t; if (!raf) raf = requestAnimationFrame(gambar); },
      error(t) { batal(); isi.innerHTML = '<span class="err">' + esc(t) + "</span>"; },
      selesai(t) {
        batal();
        isi.innerHTML = renderMd(t);
        const a = document.createElement("div");
        a.className = "actions";
        const s = document.createElement("button");
        s.className = "icon-btn sm"; s.title = "Baca"; s.innerHTML = IC.spk; s.onclick = () => speak(t);
        const c = document.createElement("button");
        c.className = "icon-btn sm"; c.title = "Salin"; c.innerHTML = IC.copy; c.onclick = () => copyText(t);
        a.appendChild(s); a.appendChild(c);
        b.appendChild(a);
        scrollBawah();
      },
      hapus() { batal(); row.remove(); }
    };
  }

  chat.addEventListener("click", (e) => {
    const btn = e.target.closest(".copy-code");
    if (!btn) return;
    const code = btn.closest(".code").querySelector("code").textContent;
    copyText(code);
  });

  // ============ KIRIM ============
  function setBusy(v) {
    busy = v;
    sendBtn.innerHTML = v ? IC.stop : IC.send;
  }

  async function kirim(teksParam) {
    if (busy) return;
    const teks = (typeof teksParam === "string" ? teksParam : input.value).trim();
    if (!teks && !lampiran.length) return;

    const att = lampiran.splice(0, lampiran.length);
    renderChips();
    input.value = ""; autosize();
    sembunyikanKosong();
    tambahUser(teks, att);

    let penuh = teks;
    att.filter(a => a.type === "text").forEach(f => {
      penuh += "\n\n[File: " + f.name + "]\n```\n" + f.text + "\n```";
    });
    const parts = [{ text: penuh.trim() || "Jelaskan gambar ini." }];
    att.filter(a => a.type === "image").forEach(i => {
      const pecah = i.dataUrl.split(",");
      const mime = (pecah[0].match(/data:(.*?);/) || [])[1] || "image/jpeg";
      parts.push({ inlineData: { mimeType: mime, data: pecah[1] } });
    });
    riwayat.push({ role: "user", parts });

    setBusy(true);
    const ai = tambahAi();
    let jawaban = "";
    ctrl = new AbortController();
    try {
      const model = await pastikanModel();
      const res = await fetch(BASE + "/models/" + encodeURIComponent(model) + ":streamGenerateContent?alt=sse", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": API_KEY },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
          contents: riwayat
        }),
        signal: ctrl.signal
      });
      if (!res.ok) {
        let msg = "HTTP " + res.status;
        try { const d = await res.json(); if (d.error && d.error.message) msg = d.error.message; } catch (_) {}
        throw new Error(msg);
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      let alasanBerhenti = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        let berubah = false;
        for (const ln of lines) {
          const t = ln.trim();
          if (!t.startsWith("data:")) continue;
          const d = t.slice(5).trim();
          if (!d || d === "[DONE]") continue;
          let j;
          try { j = JSON.parse(d); } catch (_) { continue; }
          if (j.error) throw new Error(j.error.message || "Error dari server");
          if (j.promptFeedback && j.promptFeedback.blockReason) {
            throw new Error("Pesan diblokir oleh Gemini: " + j.promptFeedback.blockReason);
          }
          const cand = j.candidates && j.candidates[0];
          if (!cand) continue;
          if (cand.finishReason) alasanBerhenti = cand.finishReason;
          const ps = cand.content && cand.content.parts;
          if (ps) {
            for (const p of ps) {
              if (p.text && !p.thought) { jawaban += p.text; berubah = true; }
            }
          }
        }
        if (berubah) ai.set(jawaban);
      }
      if (!jawaban) {
        throw new Error(alasanBerhenti && alasanBerhenti !== "STOP"
          ? "Jawaban kosong (" + alasanBerhenti + ")."
          : "Jawaban kosong dari server.");
      }
    } catch (err) {
      if (err.name === "AbortError") {
        if (!jawaban) { ai.hapus(); riwayat.pop(); }
      } else {
        ai.error("Error: " + err.message);
        riwayat.pop();
        jawaban = "";
      }
    }
    if (jawaban) {
      riwayat.push({ role: "model", parts: [{ text: jawaban }] });
      ai.selesai(jawaban);
      if (autoSpeak) speak(jawaban);
    }
    ctrl = null;
    setBusy(false);
  }

  sendBtn.addEventListener("click", () => {
    if (busy) { ctrl && ctrl.abort(); return; }
    kirim();
  });
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) {
      e.preventDefault();
      kirim();
    }
  });
  newBtn.addEventListener("click", () => {
    if (ctrl) ctrl.abort();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    riwayat = [];
    lampiran.length = 0; renderChips();
    kosongkan();
  });

  // ============ MULAI ============
  kosongkan();
  muatModel().catch(e => toast("Gagal memuat model: " + e.message));
</script>
</body>
</html>
